<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Home-screen install. iOS needs a PNG touch icon (it ignores SVG). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No web manifest on purpose: without one, "Add to Home Screen" uses the
         current address, which carries the person's invite link, so the
         home-screen app signs them in by itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="STS Names" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Staff-only app with photos of students: keep it out of search results
         and link previews. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>STS - Know your Names!</title>
    <meta name="description" content="Staff sign-in required." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
