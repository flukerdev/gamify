name: Leaderboard change notifications

# Once a day at 14:00 Eastern. Fires at 18:00 UTC (= 2pm EDT) and 19:00 UTC
# (= 2pm EST); the handler's ET-hour guard makes only the run that is actually
# 2pm ET send. For each game it compares current ranks to the snapshot from the
# previous day's run and notifies anyone who dropped, naming who passed them.
# Manual "Run workflow" passes ?force=1 to bypass the hour guard for testing.
# See cron-daily-quiz.yml for CRON_SECRET / auto-disable notes.

on:
  schedule:
    - cron: '0 18,19 * * *'
  workflow_dispatch:

jobs:
  leaderboard-changes:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/notifications/leaderboard-changes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '?force=1' || '' }}
        run: |
          curl -sS --fail-with-body \
            -X POST "https://gamify-matflukers-projects.vercel.app/api/cron/notifications/leaderboard-changes${FORCE}" \
            -H "Authorization: Bearer $CRON_SECRET"
